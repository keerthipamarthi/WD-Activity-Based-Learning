<!DOCTYPE html><html>
<head>
    <title> Shopping Store</title><style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f4f4f4;
    }

    header {
        background-color: #232f3e;
        color: white;
        text-align: center;
        padding: 20px;
    }

    nav {
        background-color: #37475a;
        padding: 15px;
        text-align: center;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin: 15px;
    }

    h2 {
        text-align: center;
        color: #232f3e;
    }

    .products {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
        padding: 20px;
    }

    .product {
        background-color: white;
        width: 220px;
        padding: 15px;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 2px 8px #cccccc;
    }

    .product img {
        width: 150px;
        height: 150px;
        object-fit: contain;
    }

    .price {
        color: green;
        font-size: 20px;
        font-weight: bold;
    }

    button {
        background-color: orange;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
    }

    footer {
        background-color: #232f3e;
        color: white;
        text-align: center;
        padding: 15px;
    }
</style>

</head><body><header>
    <h1>Arun Shopping Store</h1>
    <p>Welcome to Online Shopping!</p>
</header><nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
</nav><h2 id="home">Our Products</h2><div class="products" id="products"><div class="product">
    <img src="e.jpg" alt="Headphones">
    <h3>Headphones</h3>
    <p>High-quality headphones</p>
    <p class="price">₹999</p>
    <button>Add to Cart</button>
</div>

<div class="product">
    <img src="k.jpg" alt="Watch">
    <h3>Smart Watch</h3>
    <p>Stylish digital watch</p>
    <p class="price">₹1,499</p>
    <button>Add to Cart</button>
</div>

<div class="product">
    <img src="r.jpg" alt="Shoes">
    <h3>Shoes</h3>
    <p>Comfortable casual shoes</p>
    <p class="price">₹1,199</p>
    <button>Add to Cart</button>
</div>

</div><footer id="contact">
    <p>Contact: keerthi@example.com</p>
    <p>Thank you for visiting our store!</p>
</footer></body>
</html>
